name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:functions
      - run: npm run lint:functions

  database:
    name: Database (RLS and constraints)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # supabase start also loads the Edge Function, which imports the generated core copy.
      - run: node scripts/sync-core.mjs
      # Full local stack, so the storage schema exists for the receipt policy tests.
      - run: supabase start
      - run: supabase test db
